name: "Tag git"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag:
    name: "Create git tag"
    runs-on: ubuntu-latest
    # Pushes the tag and the version bump over SSH using the bot key, so the
    # job token itself only needs to read the repository.
    permissions:
      contents: read
    env:
      ssh_dir: /home/runner/.ssh
      # Pinned commit of miguelaferreira/semver_bash (was: master)
      semver_bash_sha: d7d570e9ab64ed432189a55e17cdb1305b401d7b
    if: "!contains(github.event.head_commit.message, 'Increment version')"
    steps:
      - name: "Setup tools"
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSL -o semver_bash.zip "https://github.com/miguelaferreira/semver_bash/archive/${semver_bash_sha}.zip"
          unzip -q semver_bash.zip
          cd "semver_bash-${semver_bash_sha}"
          sudo mv semver.sh bump.sh /bin
          sudo chmod +x /bin/bump.sh

      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: "Bump version number"
        id: bump
        run: |
          version="$(cat ${version_file})"
          bump.sh "${version}" > ${version_file}
          {
            echo "version-file=${version_file}"
            echo "version=${version}"
            echo "new-version=$(cat ${version_file})"
          } >> "$GITHUB_OUTPUT"
        env:
          version_file: VERSION

      - name: "Configure git"
        run: |
          git remote rm origin
          git remote add origin git@github.com:miguelaferreira/devex-cli.git
          git config --global user.email "devex.bot@gmail.com"
          git config --global user.name "DevEx Bot"
          mkdir ${ssh_dir}
          echo "${ssh_config}" > ${ssh_dir}/config
          echo "${bot_devex_ssh_private_key}" > ${ssh_dir}/id_rsa
          chmod -R 500 ${ssh_dir}
        env:
          ssh_config: ${{ secrets.SSH_CONFIG }}
          bot_devex_ssh_private_key: ${{ secrets.BOT_DEVEX_SSH_PRIVATE_KEY_RSA }}

      - name: "Create tag"
        run: |
          git tag "${tag}"
          git push --tags
        env:
          tag: "v${{ steps.bump.outputs.version }}"

      - name: "Create bump commit"
        run: |
          git push --set-upstream origin main
          git add ${version_file}
          git commit -m "${commit_message}"
          git push
        env:
          version_file: ${{ steps.bump.outputs.version-file }}
          commit_message: "Increment version from '${{ steps.bump.outputs.version }}' to '${{ steps.bump.outputs.new-version }}'"

      - name: "Clean up"
        if: ${{ always() }}
        run: sudo rm -rf ${ssh_dir}
